name: oxide_guard
description: Охрана и таймеры гниения для Oxide
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: 18.0.1
  timezone: ^0.9.4
  vibration: ^2.0.0
  flutter_ringtone_player: ^4.0.0+3
  notification_listener_service: ^0.3.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
